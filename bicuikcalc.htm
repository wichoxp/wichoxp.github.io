<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Pago - GTQ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor principal que simula la pantalla de un smartphone */
        .phone-screen {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 846px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        /* Barra de navegación superior */
        .top-bar {
            background-color: #003a6c;
            color: #ffffff;
            padding: 18px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar .title {
            font-size: 19px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .top-bar .icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Área de contenido interactivo */
        .content {
            flex: 1;
            padding: 36px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .label {
            color: #1e709a;
            font-size: 21px;
            font-weight: 500;
            margin-bottom: 16px;
            letter-spacing: 0.2px;
        }

        /* Zona de entrada del monto */
        .amount-container {
            width: 100%;
            border-bottom: 2px solid #003a6c;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .currency-prefix {
            font-size: 46px;
            font-weight: bold;
            color: #003a6c;
            margin-right: 10px;
        }

        .amount-input {
            font-size: 46px;
            font-weight: bold;
            color: #003a6c;
            border: none;
            outline: none;
            width: 200px;
            background: transparent;
        }

        /* Eliminación de flechas por defecto en inputs numéricos */
        .amount-input::-webkit-outer-spin-button,
        .amount-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .amount-input[type=number] {
            -moz-appearance: textfield;
        }

        /* Bloque central de resultados oculto por defecto */
        .result-box {
            width: 100%;
            background-color: #f4f7fa;
            border: 1px dashed #1e709a;
            border-radius: 8px;
            padding: 20px;
            margin-top: 10px;
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            color: #4a5568;
        }

        .result-row.total {
            border-top: 1px solid #cbd5e1;
            padding-top: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #003a6c;
        }

        /* Sección del botón inferior */
        .bottom-bar {
            padding: 24px;
            background-color: #ffffff;
        }

        .btn-confirm {
            width: 100%;
            background-color: #003a6c;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-confirm:active {
            background-color: #002546;
            transform: scale(0.99);
        }
    </style>
</head>
<body>

    <div class="phone-screen">
        <!-- Barra Superior -->
        <div class="top-bar">
            <span class="title">Sin contacto</span>
            <div class="icons">
                <!-- Icono Campana -->
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1-1.5-1s-1.5.17-1.5 1v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                </svg>
                <!-- Icono Salida -->
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
                </svg>
            </div>
        </div>

        <!-- Contenido principal -->
        <div class="content">
            <div class="label">Ingresa el monto</div>
            
            <div class="amount-container">
                <span class="currency-prefix">GTQ</span>
                <input type="number" id="monto" class="amount-input" placeholder="0.00" min="0" step="0.01">
            </div>

            <!-- Desglose de Operación -->
            <div id="panelResultado" class="result-box">
                <div class="result-row">
                    <span>Monto base:</span>
                    <span id="valBase">GTQ 0.00</span>
                </div>
                <div class="result-row">
                    <span>Servicio de plataforma de pago (1.5%):</span>
                    <span id="valServicio">GTQ 0.00</span>
                </div>
                <div class="result-row total">
                    <span>Monto Total:</span>
                    <span id="valTotal">GTQ 0.00</span>
                </div>
            </div>
        </div>

        <!-- Botón de Confirmación -->
        <div class="bottom-bar">
            <button class="btn-confirm" onclick="procesarCalculo()">Confirmar</button>
        </div>
    </div>

    <script>
        function procesarCalculo() {
            const inputMonto = document.getElementById('monto');
            const contenedor = document.getElementById('panelResultado');
            
            const valorIngresado = parseFloat(inputMonto.value);

            // Validación de la entrada de datos numéricos
            if (isNaN(valorIngresado) || valorIngresado <= 0) {
                alert("Por favor, introduce un monto válido mayor a cero.");
                contenedor.style.display = 'none';
                return;
            }

            // Operaciones lógicas solicitadas
            const recargoPlataforma = valorIngresado * 0.015;
            const montoFinal = valorIngresado + recargoPlataforma;

            // Renderizado en pantalla con redondeo estricto a 2 decimales
            document.getElementById('valBase').innerText = `GTQ ${valorIngresado.toFixed(2)}`;
            document.getElementById('valServicio').innerText = `GTQ ${recargoPlataforma.toFixed(2)}`;
            document.getElementById('valTotal').innerText = `GTQ ${montoFinal.toFixed(2)}`;

            // Mostrar el contenedor aplicando flexbox dinámico
            contenedor.style.display = 'flex';
        }
    </script>
</body>
</html>
