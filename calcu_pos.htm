<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora POS Guatemala</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; color: #333; }
        .card { background: white; max-width: 450px; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1e293b; margin-top: 0; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; background: #2563eb; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn:hover { background: #1d4ed8; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; background: #f8fafc; border-left: 5px solid #cbd5e1; }
        .recommended { border-left-color: #10b981; background: #f0fdf4; }
        .monto { font-size: 20px; font-weight: bold; color: #1e293b; }
        .provider { font-weight: bold; color: #2563eb; }
    </style>
</head>
<body>

<div class="card">
    <h2>Calculadora POS (Pequeño Contribuyente)</h2>
    
    <label for="neto">¿Cuánto dinero deseas recibir neto? (Q):</label>
    <input type="number" id="neto" placeholder="Ej. 150.00" step="0.01" min="0.01">
    
    <button class="btn" onclick="calcularMontos()">Calcular Link de Pago</button>

    <div id="resultadoCubo" class="result-box">
        <strong>CUBO POS:</strong><br>
        Monto a cobrar en el link: <span id="txtCubo" class="monto">Q0.00</span>
    </div>

    <div id="resultadoRecurrente" class="result-box">
        <strong>RECURRENTE POS:</strong><br>
        Monto a cobrar en el link: <span id="txtRecurrente" class="monto">Q0.00</span>
    </div>
</div>

<script>
function calcularMontos() {
    const neto = parseFloat(document.getElementById('neto').value);
    
    if (isNaN(neto) || neto <= 0) {
        alert("Por favor, ingresa un monto válido mayor a 0.");
        return;
    }

    // Fórmulas matemáticas despejadas
    const linkCubo = neto / 0.9441;
    const linkRecurrente = (neto + 2.00) / 0.955;

    // Mostrar resultados en pantalla con dos decimales
    document.getElementById('txtCubo').innerText = "Q" + linkCubo.toFixed(2);
    document.getElementById('txtRecurrente').innerText = "Q" + linkRecurrente.toFixed(2);

    // Reiniciar estilos visuales de las cajas
    const boxCubo = document.getElementById('resultadoCubo');
    const boxRecurrente = document.getElementById('resultadoRecurrente');
    boxCubo.className = "result-box";
    boxRecurrente.className = "result-box";

    // Resaltar visualmente la opción más económica para tu cliente
    if (linkCubo < linkRecurrente) {
        boxCubo.className = "result-box recommended";
    } else if (linkRecurrente < linkCubo) {
        boxRecurrente.className = "result-box recommended";
    }
}
</script>

</body>
</html>
