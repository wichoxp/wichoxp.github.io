<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Recurrente POS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 600px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: 0 auto;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="number"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-limpiar {
            padding: 10px 15px;
            font-size: 14px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-limpiar:hover {
            background-color: #5a6268;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .monto-cobrar {
            font-weight: bold;
            color: #28a745;
        }
        .monto-cuota {
            font-weight: bold;
            color: #495057;
        }
        .texto-rojo {
            font-weight: bold;
            color: #dc3545;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Calculadora Recurrente POS</h2>
    
    <label for="montoEsperado">Monto de depósito esperado (Q):</label>
    <div class="input-group">
        <input type="number" id="montoEsperado" placeholder="Ej. 1000" min="0" step="0.01" oninput="calcularMontos()">
        <button class="btn-limpiar" onclick="limpiarCampo()">Limpiar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Plazo</th>
                <th>Comisión</th>
                <th>Total</th>
                <th>Cobrar</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <!-- NUEVO: Nombre de etiqueta cambiado -->
                <td>Contado 4.5%</td>
                <!-- NUEVO: Se le asignó un ID para calcular la comisión en Quetzales -->
                <td id="comisionContado">Q 0.00</td>
                <td id="contado" class="monto-cobrar">Q 0.00</td>
                <td id="cuotaContado" class="texto-rojo">Q 0.00 (3%)</td>
            </tr>
            <tr>
                <td>3 cuotas</td>
                <td>8.0%</td>
                <td id="cuotas3" class="monto-cobrar">Q 0.00</td>
                <td id="cuota3" class="monto-cuota">Q 0.00</td>
            </tr>
            <tr>
                <td>6 cuotas</td>
                <td>9.0%</td>
                <td id="cuotas6" class="monto-cobrar">Q 0.00</td>
                <td id="cuota6" class="monto-cuota">Q 0.00</td>
            </tr>
            <tr>
                <td>12 cuotas</td>
                <td>10.0%</td>
                <td id="cuotas12" class="monto-cobrar">Q 0.00</td>
                <td id="cuota12" class="monto-cuota">Q 0.00</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
function calcularMontos() {
    const montoDeseado = parseFloat(document.getElementById('montoEsperado').value);

    if (isNaN(montoDeseado) || montoDeseado <= 0) {
        resetearTabla();
        return;
    }

    const comisiones = {
        contado: 0.045,
        cuotas3: 0.08,
        cuotas6: 0.09,
        cuotas12: 0.10
    };

    // 1. Calcular los cobros totales base
    const totalContado = montoDeseado / (1 - comisiones.contado);
    const total3Cuotas = montoDeseado / (1 - comisiones.cuotas3);
    const total6Cuotas = montoDeseado / (1 - comisiones.cuotas6);
    const total12Cuotas = montoDeseado / (1 - comisiones.cuotas12);

    // NUEVO: Calcular la diferencia (Comisión en Q) para la fila de Contado
    const diffContado = totalContado - montoDeseado;

    // Calcular la diferencia para las filas de cuotas
    const diff3Cuotas = total3Cuotas - montoDeseado;
    const diff6Cuotas = total6Cuotas - montoDeseado;
    const diff12Cuotas = total12Cuotas - montoDeseado;

    // Calcular la columna "Cobrar"
    const contadoConComision3 = montoDeseado / (1 - 0.03);
    const valorCuota3 = total3Cuotas / 3;
    const valorCuota6 = total6Cuotas / 6;
    const valorCuota12 = total12Cuotas / 12;

    // NUEVO: Mostrar la comisión en Quetzales para la fila 1, columna 2
    document.getElementById('comisionContado').innerText = "Q " + diffContado.toFixed(2);

    // Mostrar en Columna "Total"
    document.getElementById('contado').innerText = "Q " + totalContado.toFixed(2);
    document.getElementById('cuotas3').innerText = "Q " + diff3Cuotas.toFixed(2);
    document.getElementById('cuotas6').innerText = "Q " + diff6Cuotas.toFixed(2);
    document.getElementById('cuotas12').innerText = "Q " + diff12Cuotas.toFixed(2);

    // Mostrar en Columna "Cobrar"
    document.getElementById('cuotaContado').innerText = "Q " + contadoConComision3.toFixed(2) + " (3%)";
    document.getElementById('cuota3').innerText = "Q " + valorCuota3.toFixed(2);
    document.getElementById('cuota6').innerText = "Q " + valorCuota6.toFixed(2);
    document.getElementById('cuota12').innerText = "Q " + valorCuota12.toFixed(2);
}

function limpiarCampo() {
    document.getElementById('montoEsperado').value = "";
    resetearTabla();
}

function resetearTabla() {
    // NUEVO: Resetear la celda de comisión contado
    document.getElementById('comisionContado').innerText = "Q 0.00";

    document.getElementById('contado').innerText = "Q 0.00";
    document.getElementById('cuotas3').innerText = "Q 0.00";
    document.getElementById('cuotas6').innerText = "Q 0.00";
    document.getElementById('cuotas12').innerText = "Q 0.00";
    
    document.getElementById('cuotaContado').innerText = "Q 0.00 (3%)";
    document.getElementById('cuota3').innerText = "Q 0.00";
    document.getElementById('cuota6').innerText = "Q 0.00";
    document.getElementById('cuota12').innerText = "Q 0.00";
}
</script>

</body>
</html>
