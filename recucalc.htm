<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Recurrente POS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 650px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: 0 auto;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="number"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-limpiar {
            padding: 10px 15px;
            font-size: 14px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-limpiar:hover {
            background-color: #5a6268;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            font-weight: bold;
            cursor: pointer;
            color: #6c757d;
        }
        .checkbox-group input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            height: 20px;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .monto-cobrar {
            font-weight: bold;
            color: #28a745;
        }
        .monto-cuota {
            font-weight: bold;
            color: #495057;
        }
        .texto-rojo {
            font-weight: bold;
            color: #dc3545;
        }
        .columna-total {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Calculadora Recurrente POS</h2>
    
    <label for="montoEsperado">Monto de depósito esperado (Q):</label>
    <div class="input-group">
        <input type="number" id="montoEsperado" placeholder="Ej. 1000" min="0" step="0.01" oninput="calcularMontos()">
        <button class="btn-limpiar" onclick="limpiarCampo()">Limpiar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Plazo</th>
                <th>Comisión</th>
                <th>Cargo/Mes</th>
                <th>Cuota/Mes</th>
                <!-- NUEVO: Nombre de columna cambiado a "Cobro" -->
                <th class="columna-total">Cobro</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <!-- NUEVO: Etiqueta cambiada a "Chaz 4.5%" -->
                <td>Chaz 4.5%</td>
                <td id="comisionContado"></td>
                <td id="contado" class="monto-cobrar"></td>
                <td id="cuotaContado" class="texto-rojo"></td>
                <td id="totalContado" class="texto-rojo columna-total"></td>
            </tr>
            <tr>
                <td>3 cuotas</td>
                <td>8.0%</td>
                <td id="cuotas3" class="monto-cobrar"></td>
                <td id="cuota3" class="monto-cuota"></td>
                <td id="total3" class="monto-cuota columna-total"></td>
            </tr>
            <tr>
                <td>6 cuotas</td>
                <td>9.0%</td>
                <td id="cuotas6" class="monto-cobrar"></td>
                <td id="cuota6" class="monto-cuota"></td>
                <td id="total6" class="monto-cuota columna-total"></td>
            </tr>
            <tr>
                <td>12 cuotas</td>
                <td>10.0%</td>
                <td id="cuotas12" class="monto-cobrar"></td>
                <td id="cuota12" class="monto-cuota"></td>
                <td id="total12" class="monto-cuota columna-total"></td>
            </tr>
        </tbody>
    </table>

    <!-- NUEVO: Etiqueta de la casilla cambiada a "Cobrar" -->
    <label class="checkbox-group">
        <input type="checkbox" id="chkTotal" onchange="alternarColumnaTotal()"> Cobrar
    </label>
</div>

<script>
function calcularMontos() {
    const montoDeseado = parseFloat(document.getElementById('montoEsperado').value);

    if (isNaN(montoDeseado) || montoDeseado <= 0) {
        resetearTabla();
        return;
    }

    const comisiones = {
        contado: 0.045,
        cuotas3: 0.08,
        cuotas6: 0.09,
        cuotas12: 0.10
    };

    const totalContado = montoDeseado / (1 - comisiones.contado);
    const total3Cuotas = montoDeseado / (1 - comisiones.cuotas3);
    const total6Cuotas = montoDeseado / (1 - comisiones.cuotas6);
    const total12Cuotas = montoDeseado / (1 - comisiones.cuotas12);

    const diffContado = totalContado - montoDeseado;
    const diff3Cuotas = total3Cuotas - montoDeseado;
    const diff6Cuotas = total6Cuotas - montoDeseado;
    const diff12Cuotas = total12Cuotas - montoDeseado;

    const sumaMontoMasComisionContado = montoDeseado + diffContado;

    const comisionMensual3 = diff3Cuotas / 3;
    const comisionMensual6 = diff6Cuotas / 6;
    const comisionMensual12 = diff12Cuotas / 12;

    const contadoConComision3 = montoDeseado / (1 - 0.03);
    const valorCuota3 = total3Cuotas / 3;
    const valorCuota6 = total6Cuotas / 6;
    const valorCuota12 = total12Cuotas / 12;

    const totalFilaContado = contadoConComision3 * 1;
    const totalFila3 = valorCuota3 * 3;
    const totalFila6 = valorCuota6 * 6;
    const totalFila12 = valorCuota12 * 12;

    document.getElementById('comisionContado').innerText = "Q " + diffContado.toFixed(2);

    document.getElementById('contado').innerText = "Q " + sumaMontoMasComisionContado.toFixed(2);
    document.getElementById('cuotas3').innerText = "Q " + comisionMensual3.toFixed(2);
    document.getElementById('cuotas6').innerText = "Q " + comisionMensual6.toFixed(2);
    document.getElementById('cuotas12').innerText = "Q " + comisionMensual12.toFixed(2);

    // Muestra en columna "Cuota/Mes" (Mantiene el (3%) solicitado anteriormente)
    document.getElementById('cuotaContado').innerText = "Q " + contadoConComision3.toFixed(2) + " (3%)";
    document.getElementById('cuota3').innerText = "Q " + valorCuota3.toFixed(2);
    document.getElementById('cuota6').innerText = "Q " + valorCuota6.toFixed(2);
    document.getElementById('cuota12').innerText = "Q " + valorCuota12.toFixed(2);

    // NUEVO: Muestra en la columna "Cobro" quitando el "(3%)" de la primera fila
    document.getElementById('totalContado').innerText = "Q " + totalFilaContado.toFixed(2);
    document.getElementById('total3').innerText = "Q " + totalFila3.toFixed(2);
    document.getElementById('total6').innerText = "Q " + totalFila6.toFixed(2);
    document.getElementById('total12').innerText = "Q " + totalFila12.toFixed(2);
}

function alternarColumnaTotal() {
    const checked = document.getElementById('chkTotal').checked;
    const elementosColumna = document.querySelectorAll('.columna-total');
    
    elementosColumna.forEach(el => {
        el.style.display = checked ? 'table-cell' : 'none';
    });
}

function limpiarCampo() {
    document.getElementById('montoEsperado').value = "";
    resetearTabla();
}

function resetearTabla() {
    document.getElementById('comisionContado').innerText = "";

    document.getElementById('contado').innerText = "";
    document.getElementById('cuotas3').innerText = "";
    document.getElementById('cuotas6').innerText = "";
    document.getElementById('cuotas12').innerText = "";
    
    document.getElementById('cuotaContado').innerText = "";
    document.getElementById('cuota3').innerText = "";
    document.getElementById('cuota6').innerText = "";
    document.getElementById('cuota12').innerText = "";

    document.getElementById('totalContado').innerText = "";
    document.getElementById('total3').innerText = "";
    document.getElementById('total6').innerText = "";
    document.getElementById('total12').innerText = "";
}
</script>

</body>
</html>
